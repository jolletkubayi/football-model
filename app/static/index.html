<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Model</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1f1c; --muted: #6b6f68; --line: #e2dfd8;
    --home: #1f6f5c; --draw: #b9b3a6; --away: #c4552d; --value: #1f6f5c; --value-bg: #e3f1ec;
    --warn: #9a6a00; --warn-bg: #fbf1d9; --accent: #1d1f1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --card: #1d1f1c; --ink: #ecebe6; --muted: #9a9d95; --line: #2e312c;
      --home: #4fb497; --draw: #5b5d57; --away: #e07a52; --value: #6fd0b1; --value-bg: #183229;
      --warn: #e8b84a; --warn-bg: #33290f; --accent: #ecebe6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 16px 10px; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button, input { font: inherit; color: var(--ink); background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .status .err { color: var(--away); }
  nav { display: flex; gap: 4px; max-width: 980px; margin: 6px auto 0; padding: 0 16px;
        border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: none; background: none; border-bottom: 2px solid transparent;
               border-radius: 0; padding: 10px 12px; color: var(--muted); }
  nav button.on { color: var(--ink); border-bottom-color: var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 12px; }
  .when { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
           font-weight: 600; font-size: 16px; margin: 6px 0 10px; }
  .teams .a { text-align: right; }
  .teams .v { color: var(--muted); font-weight: 400; font-size: 13px; }
  .probbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; font-size: 12px;
             font-weight: 600; color: #fff; }
  .probbar div { display: flex; align-items: center; justify-content: center; min-width: 0; white-space: nowrap; }
  .probbar .h { background: var(--home); } .probbar .d { background: var(--draw); color: var(--ink); }
  .probbar .a { background: var(--away); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .cell { font-size: 13px; }
  .cell label { display: block; color: var(--muted); font-size: 12px; }
  .cell input { width: 100%; padding: 6px 8px; }
  .edge { font-size: 12px; margin-top: 4px; min-height: 16px; color: var(--muted); }
  .edge.value { color: var(--value); font-weight: 600; background: var(--value-bg);
                border-radius: 6px; padding: 2px 6px; display: inline-block; }
  .extras { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .extras b { color: var(--ink); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 13px; }
  .settings label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .settings input { width: 200px; }
  .hidden { display: none; }
  @media (max-width: 560px) { .teams { font-size: 14px; } .grid3 { gap: 6px; } }
</style>
</head>
<body>
<header>
  <h1>Football Model</h1>
  <div class="bar">
    <select id="comp"></select>
    <select id="days">
      <option value="3">Next 3 days</option>
      <option value="7">Next 7 days</option>
      <option value="14" selected>Next 14 days</option>
      <option value="30">Next 30 days</option>
    </select>
    <button id="syncBtn">Sync</button>
  </div>
  <div class="status" id="status"></div>
</header>
<nav>
  <button data-tab="fixtures" class="on">Fixtures</button>
  <button data-tab="ratings">Ratings</button>
  <button data-tab="check">Model check</button>
  <button data-tab="settings">Settings</button>
</nav>
<main>
  <section id="tab-fixtures"></section>
  <section id="tab-ratings" class="hidden"></section>
  <section id="tab-check" class="hidden"></section>
  <section id="tab-settings" class="hidden">
    <div class="card settings">
      <label for="bankroll">Bankroll (R)</label>
      <input id="bankroll" type="number" min="0" step="50">
      <label for="kelly">Kelly fraction (0.1 to 0.5; lower is safer)</label>
      <input id="kelly" type="number" min="0.05" max="1" step="0.05">
      <label for="minEdge">Minimum edge to flag a bet (%)</label>
      <input id="minEdge" type="number" min="0" max="50" step="1">
      <p class="note">Stakes are capped at 5% of bankroll per bet. Settings are stored in this browser only.</p>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const settings = { bankroll: store.get("bankroll", 1000), kelly: store.get("kelly", 0.25), minEdge: store.get("minEdge", 5) };
let comps = [], current = store.get("comp", "psl"), tab = "fixtures", fixturesData = null;

const pct = (x) => (100 * x).toFixed(0) + "%";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.detail || r.statusText); e.status = r.status; throw e; }
  return body;
}

function setStatus(html) { $("#status").innerHTML = html; }

function compInfo() { return comps.find((c) => c.key === current); }

function describeSync() {
  const c = compInfo();
  if (!c) return;
  const when = c.synced_at ? new Date(c.synced_at).toLocaleString() : "never";
  let s = `Last sync: ${when} &middot; ${c.results.toLocaleString()} results in training data`;
  if (c.errors.length) s += `<br><span class="err">Some sources failed: ${esc(c.errors.join("; "))}</span>`;
  setStatus(s);
}

async function loadComps() {
  comps = await api("/api/competitions");
  $("#comp").innerHTML = comps.map((c) => `<option value="${c.key}">${esc(c.name)}</option>`).join("");
  if (!comps.find((c) => c.key === current)) current = comps[0].key;
  $("#comp").value = current;
  describeSync();
}

function isStale(c) { return !c || !c.synced_at || Date.now() - new Date(c.synced_at) > 6 * 3600 * 1000; }

async function sync(force) {
  const btn = $("#syncBtn");
  btn.disabled = true;
  const first = !compInfo() || compInfo().results === 0;
  setStatus(first ? "Downloading three seasons of results. The first sync can take a minute or two..." : "Syncing...");
  try {
    await api(`/api/sync/${current}?force=${force ? "true" : "false"}`, { method: "POST" });
  } catch (e) { setStatus(`<span class="err">Sync failed: ${esc(e.message)}</span>`); }
  btn.disabled = false;
  comps = await api("/api/competitions");
  describeSync();
}

async function show() {
  if (isStale(compInfo())) await sync(false);
  if (tab === "fixtures") return renderFixtures();
  if (tab === "ratings") return renderRatings();
  if (tab === "check") return renderCheck();
}

function oddsKey(id) { return `odds:${current}:${id}`; }

function edgeHtml(p, odds) {
  if (!odds || odds <= 1) return "";
  const edge = p * odds - 1;
  const f = Math.max(0, Math.min(0.05, settings.kelly * (p * odds - 1) / (odds - 1)));
  const stake = f * settings.bankroll;
  if (edge * 100 >= settings.minEdge && stake >= 1)
    return `<span class="edge value">Edge ${(edge * 100).toFixed(1)}% &middot; stake R${stake.toFixed(0)}</span>`;
  return `<span class="edge">Edge ${(edge * 100).toFixed(1)}%</span>`;
}

function fixtureCard(f) {
  const d = new Date(f.date);
  const when = d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + " " +
               d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  const tags = (f.neutral ? `<span class="tag">Neutral venue</span>` : "") +
               (f.low_data ? `<span class="tag">Low data</span>` : "");
  const head = `<div class="when"><span>${when}</span>${tags}</div>
    <div class="teams"><div>${esc(f.home)}</div><div class="v">vs</div><div class="a">${esc(f.away)}</div></div>`;
  const p = f.prediction;
  if (!p) return `<div class="card">${head}<div class="note">Not enough history for one of these teams to price this match.</div></div>`;
  const saved = store.get(oddsKey(f.id), ["", "", ""]);
  const probs = [p.home, p.draw, p.away], labels = ["Home", "Draw", "Away"];
  const cells = probs.map((q, k) => `
    <div class="cell"><label>${labels[k]} ${pct(q)} &middot; fair ${(1 / q).toFixed(2)}</label>
      <input inputmode="decimal" placeholder="Bookie odds" data-id="${f.id}" data-k="${k}" value="${saved[k]}">
      <div class="edge" id="e-${f.id}-${k}">${edgeHtml(q, parseFloat(saved[k]))}</div></div>`).join("");
  const top = p.top_scores.map((s) => `${s.score} (${pct(s.p)})`).join(", ");
  return `<div class="card">${head}
    <div class="probbar">
      <div class="h" style="width:${p.home * 100}%">${p.home > .12 ? pct(p.home) : ""}</div>
      <div class="d" style="width:${p.draw * 100}%">${p.draw > .12 ? pct(p.draw) : ""}</div>
      <div class="a" style="width:${p.away * 100}%">${p.away > .12 ? pct(p.away) : ""}</div>
    </div>
    <div class="grid3">${cells}</div>
    <div class="extras"><span>xG <b>${p.xg_home.toFixed(2)} - ${p.xg_away.toFixed(2)}</b></span>
      <span>Over 2.5 <b>${pct(p.over25)}</b></span><span>Both score <b>${pct(p.btts)}</b></span>
      <span>Likely: <b>${top}</b></span></div></div>`;
}

async function renderFixtures() {
  const el = $("#tab-fixtures");
  el.innerHTML = `<div class="empty">Loading fixtures...</div>`;
  try {
    fixturesData = await api(`/api/fixtures/${current}?days=${$("#days").value}`);
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const fx = fixturesData.fixtures;
  el.innerHTML = fx.length ? fx.map(fixtureCard).join("") +
      `<p class="note">Enter the bookmaker's decimal odds to see the edge. A large edge usually means the model is missing team news, so check injuries and line-ups before betting.</p>`
    : `<div class="empty">No fixtures scheduled in this window.</div>`;
}

$("#tab-fixtures").addEventListener("input", (ev) => {
  const t = ev.target;
  if (!t.dataset.id) return;
  const f = fixturesData.fixtures.find((x) => x.id === t.dataset.id);
  const saved = store.get(oddsKey(t.dataset.id), ["", "", ""]);
  saved[+t.dataset.k] = t.value;
  store.set(oddsKey(t.dataset.id), saved);
  const p = f.prediction, probs = [p.home, p.draw, p.away];
  document.getElementById(`e-${t.dataset.id}-${t.dataset.k}`).innerHTML = edgeHtml(probs[+t.dataset.k], parseFloat(t.value));
});

async function renderRatings() {
  const el = $("#tab-ratings");
  el.innerHTML = `<div class="empty">Fitting model...</div>`;
  try {
    const rows = await api(`/api/ratings/${current}`);
    el.innerHTML = `<div class="card"><table><thead><tr><th>#</th><th>Team</th>
      <th class="num">Overall</th><th class="num">Attack</th><th class="num">Defence</th><th class="num">Matches</th></tr></thead><tbody>` +
      rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.team)}</td><td class="num">${r.overall.toFixed(2)}</td>
        <td class="num">${r.attack.toFixed(2)}</td><td class="num">${r.defence.toFixed(2)}</td><td class="num">${r.matches}</td></tr>`).join("") +
      `</tbody></table><p class="note">Ratings are log-scale goal effects. Higher attack scores more; higher defence concedes less. Competitions that mix leagues include clubs from every training league.</p></div>`;
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function renderCheck() {
  const el = $("#tab-check");
  el.innerHTML = `<div class="empty">Running walk-forward test on the last 180 days. This takes a few seconds...</div>`;
  try {
    const a = await api(`/api/accuracy/${current}`);
    const skill = a.skill_vs_baseline;
    el.innerHTML = `<div class="card"><div class="kpis">
      <div class="kpi"><div class="v">${a.matches}</div><div class="l">Matches tested</div></div>
      <div class="kpi"><div class="v">${a.log_loss.toFixed(3)}</div><div class="l">Model log loss (lower is better)</div></div>
      <div class="kpi"><div class="v">${a.baseline_log_loss.toFixed(3)}</div><div class="l">Baseline (league averages)</div></div>
      <div class="kpi"><div class="v">${(skill * 100).toFixed(1)}%</div><div class="l">Skill vs baseline</div></div>
      <div class="kpi"><div class="v">${pct(a.favourite_hit_rate)}</div><div class="l">Favourite won</div></div>
      </div>
      <p class="note">Each match was predicted using only results from before it. Positive skill means the model
      predicts better than just knowing how often home teams, draws and away teams win. Beating the bookmaker is a
      much higher bar: their prices usually score better than this model, and you still have to overcome their
      margin.</p></div>`;
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  tab = b.dataset.tab;
  ["fixtures", "ratings", "check", "settings"].forEach((t) => $(`#tab-${t}`).classList.toggle("hidden", t !== tab));
  show();
}));
$("#comp").addEventListener("change", () => { current = $("#comp").value; store.set("comp", current); describeSync(); show(); });
$("#days").addEventListener("change", () => tab === "fixtures" && renderFixtures());
$("#syncBtn").addEventListener("click", async () => { await sync(true); show(); });
for (const k of ["bankroll", "kelly", "minEdge"]) {
  const inp = $("#" + k);
  inp.value = settings[k];
  inp.addEventListener("change", () => { settings[k] = parseFloat(inp.value) || 0; store.set(k, settings[k]); });
}

loadComps().then(show).catch((e) => setStatus(`<span class="err">${esc(e.message)}</span>`));
</script>
</body>
</html>
